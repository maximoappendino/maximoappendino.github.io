<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maximo Appendino | Full Stack Developer & Translator</title>
    <meta name="description" content="Professional Portfolio of Maximo Appendino. Software Developer, English/Spanish Translator, and Voice Actor. View my work experience, coding projects, and demos.">

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://maximoappendino.github.io/">
    <meta property="og:title" content="Maximo Appendino | Portfolio">
    <meta property="og:description" content="English/Spanish Translator, Software Developer & Voice Actor. Explore my professional journey and projects.">
    <meta property="og:image" content="https://maximoappendino.github.io/img/pp.jpeg">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://maximoappendino.github.io/">
    <meta property="twitter:title" content="Maximo Appendino | Portfolio">
    <meta property="twitter:description" content="English/Spanish Translator, Software Developer & Voice Actor. Explore my professional journey and projects.">
    <meta property="twitter:image" content="https://maximoappendino.github.io/img/pp.jpeg">

    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎤</text></svg>">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet">

    <!-- GoatCounter Analytics -->
    <script data-goatcounter="https://maximoappendino.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>

    <!-- LinkedIn Badge -->
    <script src="https://platform.linkedin.com/badges/js/profile.js" async defer type="text/javascript"></script>
</head>
<body class="mode-professional">

    <nav id="main-nav">
        <button data-mode="1" class="nav-btn active"></button>
        <button data-mode="2" class="nav-btn"></button>
        <button data-mode="3" class="nav-btn"></button>
        <button data-mode="4" class="nav-btn"></button>
        <button data-mode="5" class="nav-btn"></button>
        <select id="lang-select" class="lang-select"></select>
    </nav>

    <a href="https://calendar.app.google/4po4kdduppXmE5gi6" target="_blank" class="schedule-btn">
        <i class="fas fa-calendar-check"></i> <span id="btn-schedule-text"></span>
    </a>

    <a href="https://wa.me/543517146520" target="_blank" class="whatsapp-btn">
        <i class="fab fa-whatsapp"></i> <span id="btn-whatsapp-text"></span>
    </a>

    <main id="app-container">

        <!-- ── DEMOS ─────────────────────────────────────────── -->
        <section id="view-audio" class="view">
            <div class="audio-header">
                <h1 id="demos-title"></h1>
                <p  id="demos-subtitle"></p>
            </div>
            <div id="demos-grid" class="demos-grid"></div>
        </section>

        <!-- ── CV ───────────────────────────────────────────── -->
        <section id="view-professional" class="view">
            <div class="cv-container" id="cv-container">
                <!-- Rendered by script.js from content.js -->
            </div>
        </section>

        <!-- ── CODING ────────────────────────────────────────── -->
        <section id="view-coding" class="view">
            <div class="scanlines"></div>
            <div class="retro-container">
                <a id="coding-github-link" href="" target="_blank">
                    <h1 id="coding-title" class="blink"></h1>
                </a>
                <marquee id="coding-scrolling" scrollamount="10" class="scrolling-text"></marquee>

                <div class="retro-grid">
                    <div class="retro-box full-width">
                        <h3 id="coding-activity-label"></h3>
                        <div id="activity-container">
                            <img id="gh-activity-graph" src="" alt="GitHub Activity"
                                 style="width:100%; border:1px solid #0f0; margin-top:10px;">
                        </div>
                    </div>
                    <div class="retro-box">
                        <h3 id="coding-repos-label"></h3>
                        <ul id="repo-list"></ul>
                    </div>
                    <div class="retro-box">
                        <h3 id="coding-objectives-label"></h3>
                        <ul id="work-in-progress"></ul>
                    </div>
                </div>

                <div class="terminal-footer">
                    <p id="coding-footer"></p>
                </div>
            </div>
        </section>

        <!-- ── FUTURE ────────────────────────────────────────── -->
        <section id="view-future" class="view">
            <div class="parchment">
                <h2 id="future-title" class="medieval-title"></h2>
                <div id="future-timeline" class="vertical-timeline"></div>
            </div>
        </section>

        <!-- ── PERSONAL / BLOG ───────────────────────────────── -->
        <section id="view-personal" class="view">
            <div class="blog-header">
                <h1 id="personal-title"></h1>
                <p  id="personal-subtitle"></p>
            </div>
            <div id="blog-grid" class="blog-grid"></div>
        </section>

    </main>

    <!-- Blog modal -->
    <div id="blog-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <div id="modal-body"></div>
        </div>
    </div>

    <!-- Content must load before script.js -->
    <script src="content.js"></script>
    <script src="script.js"></script>
</body>
</html>
